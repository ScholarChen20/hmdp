server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:  # 数据源配置
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp
    username: root
    password: 123456
  redis: # Redis配置
    host: 192.168.100.128
    port: 6379
    password: 123321
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  rabbitmq:  # RabbitMQ配置
    host: 192.168.100.128 # RabbitMQ服务地址
    port: 5672  # RabbitMQ服务端口
    virtual-host: /hmall # RabbitMQ服务虚拟主机
    username: hmall # RabbitMQ用户名
    password: 123 # RabbitMQ密码
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
ai:
  qwen:
    enabled: ${QWEN_ENABLED:false}
    api-key: ${QWEN_API_KEY:}
    model-name: ${QWEN_MODEL_NAME:qwen-plus}
    timeout-seconds: 30
  chat:
    memory-max-messages: 40
    memory-ttl-hours: 24
  appointment:
    confirmation-ttl-minutes: 15
