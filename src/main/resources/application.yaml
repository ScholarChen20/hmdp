spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hmdp
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: ${LOG_LEVEL:info}
ai:
  qwen:
    enabled: ${QWEN_ENABLED:false}
    api-key: ${QWEN_API_KEY:}
    model-name: ${QWEN_MODEL_NAME:qwen-plus}
    timeout-seconds: 30
  chat:
    memory-max-messages: 40
    memory-ttl-hours: 24
  appointment:
    confirmation-ttl-minutes: 15