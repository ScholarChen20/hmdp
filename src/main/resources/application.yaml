spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: hmdp
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: ${LOG_LEVEL:info}
cache:
  shop:
    ttl-minutes: ${CACHE_SHOP_TTL_MINUTES:30}
    ttl-jitter-minutes: ${CACHE_SHOP_TTL_JITTER_MINUTES:5}
ai:
  qwen:
    enabled: ${QWEN_ENABLED:false}
    api-key: ${QWEN_API_KEY:}
    model-name: ${QWEN_MODEL_NAME:qwen-plus}
    timeout-seconds: 30
  chat:
    memory-max-messages: 40
    memory-ttl-hours: 24
  appointment:
    confirmation-ttl-minutes: 15
    timeout-scan-delay-ms: ${APPOINTMENT_TIMEOUT_SCAN_DELAY_MS:60000}
  rate-limit:
    user-per-minute: ${AI_USER_RATE_LIMIT_PER_MINUTE:20}
    ip-per-minute: ${AI_IP_RATE_LIMIT_PER_MINUTE:60}
    global-per-minute: ${AI_GLOBAL_RATE_LIMIT_PER_MINUTE:600}
  safety:
    sensitive-words: ${AI_SENSITIVE_WORDS:密码,验证码,银行卡,身份证,token,secret}
    injection-patterns: ${AI_INJECTION_PATTERNS:ignore previous instructions,system prompt,developer message,越过安全限制,忽略之前的指令}
